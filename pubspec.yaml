name: future_project
description: "MuscleUp fitness app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  http: ^1.6.0
  supabase_flutter: ^2.16.0
  flutter_svg: ^2.2.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  rename_app: ^1.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/body_types/
    - assets/exercises/targets/
    - assets/anatomy/
    - assets/anatomy_svg/
    - assets/exercises/anatomy/