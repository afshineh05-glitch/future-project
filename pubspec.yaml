name: future_project
description: "MuscleUp fitness app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  desktop_drop: 0.7.1
  http: ^1.6.0
  supabase_flutter: ^2.16.0
  flutter_svg: ^2.2.0
  video_player: ^2.14.0
  audioplayers: ^6.8.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.5
  health: ^13.3.2
  record: ^7.1.1
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  rename_app: ^1.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/body_types/
    - assets/exercises/targets/
    - assets/anatomy/
    - assets/anatomy_svg/
    - assets/exercises/anatomy/
    - assets/nutrition/foods/
    - assets/nutrition/recipes/
    - assets/nutrition/shakes/
    - assets/nutrition/supplements/
    - assets/nutrition/offers/
